<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laundry Management System</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #495057;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 4px solid rgba(0, 123, 255, 0.2);
      border-top-color: #007bff;
      animation: spin 1s linear infinite;
    }

    .note {
      font-size: 14px;
      text-align: center;
      padding: 0 16px;
    }

    .fallback-btn {
      border: none;
      background: #007bff;
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .fallback-btn:hover {
      background: #0069d9;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <div class="note">Opening the Laundry Management System...</div>
    <button class="fallback-btn" id="openDirectBtn" type="button">Open directly</button>
  </div>

  <script>
    (function () {
      'use strict';

      var baseUrl = 'https://script.google.com/macros/s/AKfycbxO1ou30pDDPamw6_1o10rKvtV8ALacuQQ_qW1Kp3VytICHhYnWz7_TvtddoFanaU1o/exec';
      var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
      var targetUrl = isMobile ? baseUrl + '?mode=mobile' : baseUrl;

      function openDirect() {
        window.location.replace(targetUrl);
      }

      document.getElementById('openDirectBtn').addEventListener('click', openDirect);

      setTimeout(openDirect, 600);
    })();
  </script>
</body>
</html>
