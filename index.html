<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Laundry Management System Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e7f0ff 0%, #f8fbff 100%);
      color: #1f2a37;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: min(520px, 100%);
      background: #fff;
      border: 1px solid #dbe4f0;
      border-radius: 14px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: #007bff;
      color: #fff;
    }

    .btn-primary:hover { background: #0062cc; }

    .btn-ghost {
      background: #eef4ff;
      color: #174ea6;
    }

    .small {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Opening Laundry App</h1>
      <div class="actions">
        <button id="openNowBtn" class="btn btn-primary">Open now</button>
        <button id="retryBtn" class="btn btn-ghost">Retry redirect</button>
      </div>
      <div class="small" id="statusText">Redirecting...</div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var baseUrl = 'https://script.google.com/macros/s/AKfycbwBYKWjwILbigUqaFlDfAxc52bdoG52Q5a3QvTp1ltBXNNLifrGKL1uQZgRuXAOLpeJ/exec';
      var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
      var targetUrl = isMobile ? baseUrl + '?mode=mobile' : baseUrl;

      var openNowBtn = document.getElementById('openNowBtn');
      var retryBtn = document.getElementById('retryBtn');
      var statusText = document.getElementById('statusText');

      function openDirect() {
        statusText.textContent = 'Opening app...';
        window.location.replace(targetUrl);
      }

      openNowBtn.addEventListener('click', openDirect);
      retryBtn.addEventListener('click', openDirect);

      // Auto-start redirect quickly; buttons remain as manual fallback.
      setTimeout(openDirect, 400);
    })();
  </script>
</body>
</html>
