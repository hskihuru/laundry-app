<!doctype html>
<html lang="en">
<head>
  <title>Site Maintenance</title>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      padding: 20px;
      font: 20px Helvetica, sans-serif;
      color: #333;
      background-color: #FFFFFF;
    }
    @media (min-width: 768px) {
      body { padding-top: 150px; }
    }
    h1 { font-size: 50px; }
    article { display: block; text-align: left; max-width: 650px; margin: 0 auto; }
    a { color: #dc8100; text-decoration: none; }
    a:hover { color: #333; text-decoration: none; }
    .countdown {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      margin-top: 30px;
      text-align: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .countdown p {
      background: #f5f5f5;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      min-width: 100px;
      margin: 0;
    }
    @media (max-width: 500px) {
      .countdown p { width: calc(50% - 15px); }
    }
  </style>
</head>
<body>
  <article>
    <h1>We&rsquo;ll be back soon!</h1>
    <div>
      <p>Sorry for the inconvenience but we&rsquo;re performing some maintenance at the moment. If you need to you can always <a href="mailto:you@example.com">contact us</a>, otherwise we&rsquo;ll be back online shortly!</p>
      <p>&mdash; The Team</p>
    </div>
    <div class="countdown">
      <p class="day"></p>
      <p class="hour"></p>
      <p class="minute"></p>
      <p class="second"></p>
    </div>
  </article>
  <script>
    // Set your target date here (format: 'Month Day, Year HH:MM:SS')
    const targetDate = new Date('December 28, 2025 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector('.day').innerText = '0 Days';
        document.querySelector('.hour').innerText = '0 Hours';
        document.querySelector('.minute').innerText = '0 Minutes';
        document.querySelector('.second').innerText = '0 Seconds';
        return;
      }

      const second = 1000;
      const minute = second * 60;
      const hour = minute * 60;
      const day = hour * 24;

      const days = Math.floor(distance / day);
      const hours = Math.floor((distance % day) / hour);
      const minutes = Math.floor((distance % hour) / minute);
      const seconds = Math.floor((distance % minute) / second);

      document.querySelector('.day').innerText = days + ' Days';
      document.querySelector('.hour').innerText = hours + ' Hours';
      document.querySelector('.minute').innerText = minutes + ' Minutes';
      document.querySelector('.second').innerText = seconds + ' Seconds';
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
